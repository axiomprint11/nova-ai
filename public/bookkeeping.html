<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookkeeping AI · Axiom AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/axiom-shared.css">
<style>
  /* Bookkeeping AI — BookkeeperAI proposes, you approve. Only BOOKKEEPER_USERS see this page. */
  body { display: flex; flex-direction: column; height: 100vh; margin: 0; background: var(--bg, #f6f6fb); }
  .bk-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
  .bk-top h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .bk-top h1 span { font-weight: 500; color: var(--muted); }
  .bk-top .sp { flex: 1; }
  .bk-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .bk-tabs button { border: 1px solid transparent; background: none; padding: 7px 13px; border-radius: 9px; font: 600 13px/1 inherit; color: var(--ink-soft); cursor: pointer; }
  .bk-tabs button.on { background: var(--indigo-light); color: var(--indigo-dark); }
  .bk-tabs.main { gap: 6px; margin: 0 auto; padding-right: 180px; } .bk-tabs.main button { font-size: 14px; padding: 9px 18px; border-radius: 10px; }
  .bk-tabs.main button.on { background: var(--indigo); color: #fff; } .bk-tabs.main button.on .n { background: #fff; color: var(--indigo-dark); }
  .bk-tabs.small { flex-basis: 100%; justify-content: flex-end; margin-top: -4px; }
  .bk-tabs.small button { font-size: 12.5px; font-weight: 500; padding: 5px 10px; }
  .bk-top { padding-bottom: 6px; }
  .bk-logo { display: block; width: 60px; height: 60px; border-radius: 10px; object-fit: contain; background: #fff; border: 1px solid var(--line); padding: 2px; box-sizing: border-box; }
  .bk-logo.ph { display: grid; place-items: center; background: #eef2ff; color: #4338ca; font-weight: 700; font-size: 20px; }
  a.bk-open { color: inherit; text-decoration: none; } a.bk-open:hover .bk-logo { box-shadow: 0 0 0 2px var(--indigo-light); } a.bk-name { font-weight: 700; } a.bk-name:hover { color: var(--indigo-dark); text-decoration: underline; }
  table.bk-dir td.c, table.bk-dir th.c { text-align: center; } table.bk-dir td { vertical-align: middle; } table.bk-dir td:first-child { width: 60px; padding-right: 4px; }
  table.bk-dir .valias { width: 150px; } .bk-check input { width: 16px; height: 16px; cursor: pointer; } .bk-dim { color: #9a99ad; font-size: 11px; }
  .bk-modal { position: fixed; inset: 0; background: rgba(20, 20, 40, .45); display: grid; place-items: center; z-index: 50; padding: 20px; }
  .bk-modal-box { background: #fff; border-radius: 14px; padding: 18px 20px; width: min(520px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .bk-modal-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; } .bk-modal-head > div { flex: 1; } .bk-modal-head .bk-logo { width: 72px; height: 72px; }
  .bk-modal-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .bk-chart { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 760px) { .bk-chart { grid-template-columns: 1fr; } }
  .bk-tree { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fafafe; font-size: 13px; max-height: 320px; overflow: auto; }
  .bk-tree-t { font-weight: 700; margin-top: 6px; } .bk-tree-t:first-of-type { margin-top: 0; } .bk-tree-k { padding-left: 16px; color: var(--ink-soft); } .bk-tree-k::before { content: '└ '; color: #c7c7d6; }
  /* category picker */
  .ckp { display: inline-block; max-width: 100%; vertical-align: middle; }
  .ckp-btn { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 150px; max-width: 100%; min-height: 32px; padding: 3px 26px 3px 8px; position: relative; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; text-align: left; }
  .ckp-btn:hover, .ckp.open .ckp-btn { border-color: #a5b4fc; } .ckp.open .ckp-btn { box-shadow: 0 0 0 3px #e0e7ff; }
  .ckp-caret { position: absolute; right: 9px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid #8b8ba3; border-bottom: 1.5px solid #8b8ba3; transform: translateY(-70%) rotate(45deg); }
  .ckp-empty { color: var(--muted); } .ckp-one { display: flex; flex-direction: column; line-height: 1.15; font-weight: 600; } .ckp-one small { font-weight: 500; font-size: 10.5px; color: var(--muted); }
  .ckp-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px 2px 8px; border-radius: 20px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 600; }
  .ckp-chip i { font-style: normal; font-weight: 700; color: #818cf8; padding: 0 2px; border-radius: 10px; } .ckp-chip i:hover { background: #c7d2fe; color: #312e81; }
  .ckp-pop { position: fixed; z-index: 60; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 48px rgba(20,20,40,.18); overflow: hidden; }
  .ckp-search { padding: 8px; border-bottom: 1px solid var(--line); } .ckp-search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .ckp-list { flex: 1; overflow: auto; padding: 4px 0; }
  .ckp-gh { display: flex; align-items: center; gap: 6px; padding: 7px 12px 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; }
  .ckp-gh:hover { color: var(--indigo-dark); } .ckp-gh small { margin-left: auto; font-weight: 500; color: #b0b0c3; text-transform: none; letter-spacing: 0; }
  .ckp-gh b { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--indigo); color: #fff; }
  .ckp-tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #9a99ad; transition: transform .12s; } .ckp-g.col .ckp-tri { transform: rotate(-90deg); }
  .ckp-g.col .ckp-i { display: none; }
  .ckp-i { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 22px; font-size: 13px; cursor: pointer; }
  .ckp-i:hover { background: #f3f3fa; } .ckp-i.on { color: var(--indigo-dark); font-weight: 600; } .ckp-i.top { font-style: italic; color: var(--muted); }
  .ckp-ck { width: 14px; height: 14px; border: 1.5px solid #c7c7d6; border-radius: 4px; flex: none; position: relative; } .ckp-i.on .ckp-ck { background: var(--indigo); border-color: var(--indigo); }
  .ckp-i.on .ckp-ck::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
  .ckp-foot { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; background: #fafafe; } .ckp-foot .sp { flex: 1; } .ckp-foot a { color: var(--indigo-dark); font-weight: 600; text-decoration: none; } .ckp-foot a:hover { text-decoration: underline; }
  td .ckp .ckp-btn { min-width: 170px; } td .ckp.multi .ckp-btn { min-width: 210px; }
  .ckp-pop.single .ckp-ck { border-radius: 50%; } .ckp-pop.single .ckp-i.on .ckp-ck::after { left: 3px; top: 3px; width: 6px; height: 6px; border: 0; border-radius: 50%; background: #fff; transform: none; }
  .bk-dl { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid #f0f0f6; font-size: 13.5px; } .bk-dl span { color: var(--muted); font-size: 12.5px; }
  .bk-src { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; letter-spacing: .03em; background: #eef2ff; color: #3730a3; }
  .bk-src.vendor { background: #ecfeff; color: #155e75; } .bk-src.bill { background: #fef3c7; color: #92400e; } .bk-src.other { background: #f1f1f8; color: #4b4869; }
  td .bk-src { white-space: nowrap; font-size: 10.5px; padding: 3px 7px; }
  @media (max-width: 900px) { .bk-tabs.main { padding-right: 0; } .bk-tabs.main button { font-size: 13px; padding: 7px 12px; } }
  .bk-tabs .n { display: inline-block; min-width: 16px; padding: 1px 5px; border-radius: 9px; background: #0a84ff; color: #fff; font-size: 10.5px; line-height: 1.3; text-align: center; margin-left: 4px; }
  .bk-tabs .n:empty { display: none; }
  .bk-main { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
  .bk-view { display: none; max-width: 1180px; margin: 0 auto; }
  .bk-view[data-v=vendors], .bk-view[data-v=materials] { max-width: none; margin: 0; }
  .bk-logo.bk-mat { width: 48px; height: 48px; border-radius: 8px; } table.bk-mats td:first-child { width: 48px; }
  .bk-view.on { display: block; }
  .bk-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .bk-card h2 { font-size: 13.5px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .bk-card h2 .sp { flex: 1; }
  .bk-muted { color: var(--muted); font-size: 12.5px; }
  .bk-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font: 600 12.5px/1.2 inherit; color: var(--ink); cursor: pointer; }
  .bk-btn:hover { background: #f7f7fc; }
  .bk-btn.p { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .bk-btn.ok { border-color: #a7f3d0; color: #047857; background: #f0fdf4; }
  .bk-btn.bad { border-color: #fecaca; color: #b91c1c; background: #fef2f2; }
  .bk-btn:disabled { opacity: .55; cursor: default; }
  .bk-btn.sm { padding: 4px 9px; font-size: 12px; }
  .bk-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; border: 1px solid; }
  .bk-pill.on { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .bk-pill.off { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .bk-pill.err { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .bk-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .bk-tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .bk-tile b { display: block; font-size: 22px; font-weight: 700; }
  .bk-tile span { font-size: 12px; color: var(--muted); }
  /* proposals */
  .bk-prop { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .bk-prop:first-of-type { border-top: 0; }
  .bk-prop .body { flex: 1; min-width: 0; }
  .bk-prop .t { font-size: 13.5px; font-weight: 600; }
  .bk-prop .r { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bk-prop .q { margin-top: 6px; padding: 8px 10px; border-radius: 9px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 13px; }
  .bk-prop .acts { display: flex; gap: 6px; align-items: center; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .bk-conf { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #eef2ff; color: #3730a3; }
  .bk-conf.lo { background: #fef3c7; color: #92400e; }
  .bk-prop select, .bk-prop input[type=text] { font: inherit; font-size: 12.5px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; }
  .bk-lines { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .bk-lines div { display: flex; gap: 8px; }
  .bk-lines div span:first-child { flex: 1; }
  /* chat */
  .bk-chat { display: flex; flex-direction: column; height: 420px; }
  .bk-msgs { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 10px; }
  .bk-msg { max-width: 78%; padding: 8px 12px; border-radius: 12px; font-size: 13.5px; white-space: pre-wrap; line-height: 1.45; }
  .bk-msg.in { align-self: flex-end; background: var(--ink); color: #fff; }
  .bk-msg.out { align-self: flex-start; background: #f3f3fa; }
  .bk-msg small { display: block; font-size: 11px; opacity: .7; margin-bottom: 2px; }
  .bk-input { display: flex; gap: 8px; }
  .bk-input input { flex: 1; font: inherit; font-size: 13.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; }
  /* tables */
  table.bk { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.bk th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.bk td { padding: 7px 8px; border-bottom: 1px solid #f0f0f6; vertical-align: top; }
  table.bk td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.bk .neg { color: #b91c1c; } table.bk .pos { color: #047857; }
  .bk-filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .bk-filters input[name=q] { max-width: 360px; flex: 1; }
  .bk-filters input, .bk-filters select { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .bk-tag { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: #f1f1f8; color: #4b4869; text-transform: uppercase; letter-spacing: .03em; }
  .bk-tag.rule { background: #dcfce7; color: #166534; } .bk-tag.approved, .bk-tag.manual { background: #eef2ff; color: #3730a3; } .bk-tag.pending { background: #fef3c7; color: #92400e; } .bk-tag.draft { background: #fef3c7; color: #92400e; } .bk-tag.rejected { background: #fef2f2; color: #991b1b; }
  /* connections */
  .bk-conn { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .bk-steps { font-size: 12.5px; color: var(--ink-soft); margin: 8px 0 0; padding-left: 18px; }
  .bk-steps li { margin: 3px 0; }
  code { font-size: 12px; background: #f3f3fa; padding: 1px 5px; border-radius: 4px; }
  textarea.bk { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-height: 90px; }
  input.bk, select.bk { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .bk-note { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
  .bk-note.ok { background: #f0fdf4; color: #047857; } .bk-note.err { background: #fef2f2; color: #991b1b; }
  pre.bk-brief { white-space: pre-wrap; font: 13px/1.5 inherit; margin: 0; }
  @media (max-width: 760px) { .bk-main { padding: 10px; } .bk-prop { flex-direction: column; } .bk-prop .acts { justify-content: flex-start; } }
</style>
</head>
<body>
<div class="bk-top">
  <h1><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/><path d="M15 15h2"/></svg>Bookkeeping AI <span>· BookkeeperAI proposes, you approve</span></h1>
  <span id="runState" class="bk-pill off">Not run yet</span>
  <div class="bk-tabs main" id="tabs">
    <button data-v="brief" class="on">Daily Brief<span class="n" id="nPending"></span></button>
    <button data-v="txns">Transactions</button>
    <button data-v="bills">Bills</button>
  </div>
  <div class="bk-tabs small" id="tabs2">
    <button data-v="vendors">Suppliers &amp; vendors</button>
    <button data-v="materials">Materials &amp; GEO types</button>
    <button data-v="rules">Rules</button>
    <button data-v="conn">Connections</button>
    <button data-v="activity">Activity</button>
  </div>
</div>
<div class="bk-main">
  <section class="bk-view on" data-v="brief" id="vBrief"></section>
  <section class="bk-view" data-v="txns" id="vTxns"></section>
  <section class="bk-view" data-v="bills" id="vBills"></section>
  <section class="bk-view" data-v="vendors" id="vVendors"></section>
  <section class="bk-view" data-v="materials" id="vMaterials"></section>
  <section class="bk-view" data-v="rules" id="vRules"></section>
  <section class="bk-view" data-v="conn" id="vConn"></section>
  <section class="bk-view" data-v="activity" id="vActivity"></section>
</div>
<script src="/nova-nav.js"></script>
<script src="/bookkeeping.js"></script>
</body>
</html>

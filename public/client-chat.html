<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Nova · AxiomPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/axiom-shared.css">
<style>
  /* The customer-facing chat, for the axiomprint.com website (in an iframe). */
  html, body { height: 100%; }
  body { background: #fff; position: relative; }
  .pc-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: linear-gradient(120deg, var(--indigo), var(--violet)); color: #fff; }
  .pc-mark { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.18); display: flex;
    align-items: center; justify-content: center; font-weight: 700; }
  .pc-title { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .pc-sub { font-size: 11.5px; opacity: .85; }
  .pc-x { margin-left: auto; background: rgba(255,255,255,.16); border: none; color: #fff; width: 26px; height: 26px;
    border-radius: 7px; cursor: pointer; }
  @media (max-width: 700px) {
    .pc-head { padding: calc(9px + env(safe-area-inset-top, 0px)) 12px 9px; }
    .pc-x { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
  }
  .pc-off { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="pc-head">
  <div class="pc-mark">✦</div>
  <div><div class="pc-title">Nova</div><div class="pc-sub" id="pcSub">AxiomPrint assistant</div></div>
  <button type="button" class="pc-x" title="Close" onclick="parentSay({ type: 'nova-client:close' })">✕</button>
</div>
<div class="pc-signin" id="pcSignin" hidden>
  <span id="pcSigninText">Sign in to see your projects, get your account pricing and add to your cart.</span>
  <button type="button" id="pcSigninBtn">Sign in</button>
</div>
<div id="pcBody" class="cc"></div>
<div class="pc-login" id="pcLogin" hidden>
  <form id="pcLoginForm" autocomplete="on">
    <button type="button" class="pc-login-x" id="pcLoginX" aria-label="Close">&#x2715;</button>
    <h3>Sign in to Axiom Print</h3>
    <p>Same account as axiomprint.com — you'll be signed in on the website too.</p>
    <input type="email" id="pcEmail" name="email" autocomplete="username" placeholder="Email" required>
    <input type="password" id="pcPass" name="password" autocomplete="current-password" placeholder="Password" required>
    <div class="pc-login-err" id="pcLoginErr"></div>
    <button type="submit" class="pc-login-go" id="pcLoginGo">Sign in</button>
    <div class="pc-login-links"><a href="https://axiomprint.com/forgot-password" target="_blank" rel="noopener">Forgot password?</a>
      <a href="https://axiomprint.com/register" target="_blank" rel="noopener">Create an account</a></div>
  </form>
</div>
<script src="/axiom-speech.js"></script>
<script src="/client-chat.js"></script>
<script>
  // Sign-in comes from the website page that embeds this (see docs/CLIENT_BOT.md).
  // Only these sites may hand us a sign-in.
  const PARENTS = ['https://axiomprint.com', 'https://www.axiomprint.com'];
  const KEY = 'novaClientToken';
  // Test mode: the header script passes the test key (?k=…) while the chat is
  // open only to testers.
  const TEST_KEY = new URLSearchParams(location.search).get('k') || '';
  let token = null, chat = null;
  try { token = sessionStorage.getItem(KEY); } catch (e) {}
  function parentSay(msg) { PARENTS.forEach(o => { try { parent.postMessage(msg, o); } catch (e) {} }); }
  function keep(t) { token = t; try { sessionStorage.setItem(KEY, t); } catch (e) {} }

  async function session(body) {
    const r = await fetch('/api/client-bot/session', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ previous: token || undefined, test_key: TEST_KEY || undefined }, body || {})) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { closed(); return null; }
    if (!j.ok) return null;
    keep(j.token);
    return j;
  }
  function closed() {
    document.getElementById('pcBody').innerHTML = '<div class="pc-off">Nova is coming soon. Please contact the AxiomPrint team for help.</div>';
  }
  async function hello() {
    let r = await fetch('/api/client-bot/hello', { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) {                       // an old or expired visitor token: start fresh
      token = null; try { sessionStorage.removeItem(KEY); } catch (e) {}
      if (!(await session({}))) return;
      r = await fetch('/api/client-bot/hello', { headers: { 'Authorization': 'Bearer ' + token } });
    }
    if (r.status === 403) { closed(); return; }
    const j = await r.json().catch(() => ({}));
    document.getElementById('pcSub').textContent = j.customer && j.customer.name ? 'Signed in as ' + j.customer.name : 'AxiomPrint assistant';
    signedIn = !!j.customer;
    const opts = {
      getToken: () => token, greeting: j.greeting,
      // Signed in: Add to Cart goes straight into the website cart (Nova's server
      // does it); the page is told so it can refresh its cart count.
      signedIn: () => signedIn, onCartAdded: cartChanged,
      suggestions: j.customer
        ? [['Where is my order?', 'Where is my latest order?'], ['Business card prices', 'How much are 500 business cards?']]
        : [['Business card prices', 'How much are 500 business cards?'], ['Banner options', 'What banner materials do you have?']]
    };
    if (!chat) chat = ClientChat.mount(document.getElementById('pcBody'), opts);
    else chat.resume(j.greeting);              // signed in or out mid-chat: keep the conversation on screen
    paintSignin();
  }

  // ---- Add to Cart ----
  // Nova's server adds the item to the customer's cart (docs/CLIENT_BOT.md); this
  // only tells the website, so it refreshes its cart count straight away. The
  // site answers nova-client:cart-result, which needs nothing from us.
  let signedIn = false;
  function cartChanged() {
    parentSay({ type: 'nova-client:add-to-cart', id: Math.random().toString(36).slice(2), item: { alreadyAdded: true } });
  }

  // ---- Sign in from the chat ----
  // Guests see a Sign in bar. If the website can sign a customer in for us
  // (it answered nova-client:login-ready), the chat shows an email / password
  // form and hands the details to the PAGE — never to Nova's server or the AI.
  // Otherwise Sign in opens the website's own login, and the header script
  // notices the new login and signs the chat in.
  let loginReady = false, loginWait = null, waitingPopup = false;
  let loginUrl = 'https://axiomprint.com/login', loginPopup = null;
  const embedded = window.parent !== window;
  function paintSignin() {
    const bar = document.getElementById('pcSignin');
    bar.hidden = signedIn || !embedded;
    if (!signedIn && !waitingPopup) document.getElementById('pcSigninText').textContent =
      'Sign in to see your projects, get your account pricing and add to your cart.';
  }
  document.getElementById('pcSigninBtn').onclick = () => {
    if (loginReady) {
      document.getElementById('pcLogin').hidden = false;
      document.getElementById('pcLoginErr').textContent = '';
      setTimeout(() => document.getElementById('pcEmail').focus(), 30);
      return;
    }
    waitingPopup = true;
    // Opened here, inside the click, so pop-up blockers (Safari) allow it; the
    // page opens it instead (or goes to the login page) if this was refused.
    try { loginPopup = window.open(loginUrl, 'novaLogin', 'width=480,height=720'); } catch (e) { loginPopup = null; }
    parentSay({ type: 'nova-client:open-login', opened: !!loginPopup });
    document.getElementById('pcSigninText').textContent = 'Sign in in the window that opened — the chat picks it up by itself.';
  };
  document.getElementById('pcLoginX').onclick = () => { document.getElementById('pcLogin').hidden = true; };
  document.getElementById('pcLoginForm').onsubmit = (e) => {
    e.preventDefault();
    const go = document.getElementById('pcLoginGo'), err = document.getElementById('pcLoginErr');
    const pass = document.getElementById('pcPass');
    const id = Math.random().toString(36).slice(2);
    go.disabled = true; go.textContent = 'Signing in…'; err.textContent = '';
    loginWait = { id: id, done: (ok, msg) => {
      loginWait = null; go.disabled = false; go.textContent = 'Sign in'; pass.value = '';
      if (ok) document.getElementById('pcLogin').hidden = true;
      else err.textContent = msg || 'That email and password did not match.';
    } };
    parentSay({ type: 'nova-client:login', id: id, email: document.getElementById('pcEmail').value.trim(), password: pass.value });
    setTimeout(() => { if (loginWait && loginWait.id === id) loginWait.done(false, 'The website did not answer — please try again.'); }, 20000);
  };

  window.addEventListener('message', async (ev) => {
    if (PARENTS.indexOf(ev.origin) === -1 || !ev.data) return;
    if (ev.data.type === 'nova-client:login-ready') { loginReady = true; return; }
    if (ev.data.type === 'nova-client:login-url') {     // only a page on the website itself
      try { const u = new URL(String(ev.data.url || '')); if (PARENTS.indexOf(u.origin) !== -1) loginUrl = u.href; } catch (e) {}
      return;
    }
    if (ev.data.type === 'nova-client:login-result' && loginWait && ev.data.id === loginWait.id) {
      loginWait.done(!!ev.data.ok, ev.data.error); return;
    }
    // Signed out on the website: back to products only.
    if (ev.data.type === 'nova-client:signout') {
      if (!signedIn && chat) return;                // already a guest
      token = null; if (await session({})) hello(); return;
    }
    if (ev.data.type !== 'nova-client:signin') return;
    const body = ev.data.payload && ev.data.sig ? { payload: ev.data.payload, sig: ev.data.sig }
               : ev.data.customer_token ? { customer_token: ev.data.customer_token } : null;
    if (!body) return;
    waitingPopup = false;
    try { if (loginPopup && !loginPopup.closed) loginPopup.close(); } catch (e) {}
    loginPopup = null;
    if (await session(body)) hello();
  });

  (async function start() {
    // Every page load starts as "not signed in" (keeping the same visitor), and
    // only a fresh sign-in from the website upgrades it. A token left over from an
    // earlier page never shows one customer's orders to whoever uses the tab next.
    if (!(await session({}))) return;
    await hello();
    parentSay({ type: 'nova-client:ready' });     // the website answers with nova-client:signin
  })();
</script>
</body>
</html>

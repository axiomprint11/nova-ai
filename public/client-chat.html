<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>NovaAI · AxiomPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/axiom-shared.css">
<style>
  /* The customer-facing chat, for the axiomprint.com website (in an iframe). */
  html, body { height: 100%; }
  body { background: #fff; position: relative; }
  .pc-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    background: linear-gradient(120deg, var(--indigo), var(--violet)); color: #fff; }
  .pc-mark { flex: none; width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.2); display: flex;
    align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .pc-mark svg { width: 19px; height: 19px; }
  .pc-title { font-weight: 700; font-size: 14.5px; line-height: 1.2; display: flex; align-items: center; gap: 6px; }
  .pc-ai { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 5px; border-radius: 5px;
    background: rgba(255,255,255,.22); line-height: 1.1; }
  .pc-who { min-width: 0; }
  .pc-who .pc-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-hbtn { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: none;
    border-radius: 8px; background: rgba(255,255,255,.16); color: #fff; font: 600 12.5px/1 inherit; cursor: pointer; }
  .pc-hbtn:hover { background: rgba(255,255,255,.26); }
  .pc-hbtn svg { width: 15px; height: 15px; }
  .pc-hbtn[hidden] { display: none; }
  .pc-hbtn:not([hidden]) ~ .pc-hbtn, .pc-hbtn:not([hidden]) ~ .pc-x { margin-left: 0; }
  @media (max-width: 520px) { .pc-newbtn span { display: none; } .pc-newbtn { padding: 0 10px; } }
  .pc-signbtn { background: #fff; color: #4f46e5; }
  .pc-signbtn:hover { background: #eef0ff; }
  .pc-signbtn.wait { background: rgba(255,255,255,.16); color: #fff; }
  /* History: earlier chats of a signed-in customer */
  .pc-hist { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; background: #fff; display: flex; flex-direction: column; }
  .pc-hist[hidden] { display: none; }
  .pc-hist-top { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .pc-hist-top b { font-size: 14px; flex: 1; }
  .pc-hist-new { border: none; border-radius: 8px; background: var(--indigo); color: #fff; font: 600 12.5px/1 inherit; padding: 8px 12px; cursor: pointer; }
  .pc-hist-x { border: none; background: #f2f2f8; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .pc-hist-list { flex: 1; overflow-y: auto; padding: 6px 8px 14px; }
  .pc-hist-day { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 12px 8px 4px; }
  .pc-hist-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 9px 10px;
    border-radius: 10px; cursor: pointer; font: inherit; color: var(--text); }
  .pc-hist-item:hover { background: #f5f7ff; border-color: #e0e4fb; }
  .pc-hist-item.on { background: #eef0ff; border-color: #c7d2fe; }
  .pc-hist-item b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-hist-item span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .pc-hist-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .pc-sub { font-size: 11.5px; opacity: .85; }
  .pc-x { margin-left: auto; background: rgba(255,255,255,.16); border: none; color: #fff; width: 26px; height: 26px;
    border-radius: 7px; cursor: pointer; }
  @media (max-width: 700px) {
    .pc-head { padding: calc(9px + env(safe-area-inset-top, 0px)) 12px 9px; }
    .pc-x { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; }
    .pc-hbtn { height: 36px; border-radius: 10px; padding: 0 11px; }
    .pc-hist-item { padding: 12px 10px; }
  }
  .pc-off { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="pc-head">
  <div class="pc-mark" title="AI assistant"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2Q10.9 8.1 17 9Q10.9 9.9 10 16Q9.1 9.9 3 9Q9.1 8.1 10 2Z"/><path d="M18 13Q18.4 15.6 21 16Q18.4 16.4 18 19Q17.6 16.4 15 16Q17.6 15.6 18 13Z"/><circle cx="5" cy="19" r="1.4"/></svg></div>
  <div class="pc-who"><div class="pc-title">NovaAI</div><div class="pc-sub" id="pcSub">AxiomPrint's AI assistant</div></div>
  <button type="button" class="pc-hbtn pc-signbtn" id="pcSigninBtn" title="Sign in to see your projects, get your account pricing and add to your cart" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="pcSigninLbl">Sign in</span></button>
  <button type="button" class="pc-hbtn pc-newbtn" id="pcNewBtn" title="Start a new chat" aria-label="New chat" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg><span>New chat</span></button>
  <button type="button" class="pc-hbtn" id="pcHistBtn" title="Your earlier chats" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 8 8 8"/><polyline points="12 7 12 12 15.5 14"/></svg><span>History</span></button>
  <button type="button" class="pc-x" title="Close" onclick="parentSay({ type: 'nova-client:close' })">✕</button>
</div>
<div class="pc-hist" id="pcHist" hidden>
  <div class="pc-hist-top"><b>Your chats with NovaAI</b>
    <button type="button" class="pc-hist-new" id="pcHistNew">+ New chat</button>
    <button type="button" class="pc-hist-x" id="pcHistX" aria-label="Close history">✕</button></div>
  <div class="pc-hist-list" id="pcHistList"></div>
</div>
<div id="pcBody" class="cc"></div>
<div class="pc-login" id="pcLogin" hidden>
  <form id="pcLoginForm" autocomplete="on">
    <button type="button" class="pc-login-x" id="pcLoginX" aria-label="Close">&#x2715;</button>
    <h3>Sign in to Axiom Print</h3>
    <p>Same account as axiomprint.com — you'll be signed in on the website too.</p>
    <input type="email" id="pcEmail" name="email" autocomplete="username" placeholder="Email" required>
    <input type="password" id="pcPass" name="password" autocomplete="current-password" placeholder="Password" required>
    <div class="pc-login-err" id="pcLoginErr"></div>
    <button type="submit" class="pc-login-go" id="pcLoginGo">Sign in</button>
    <div class="pc-login-links"><a href="https://axiomprint.com/forgot-password" target="_blank" rel="noopener">Forgot password?</a>
      <a href="https://axiomprint.com/register" target="_blank" rel="noopener">Create an account</a></div>
  </form>
</div>
<script src="/axiom-voice.js"></script>
<script src="/client-chat.js"></script>
<script>
  // Sign-in comes from the website page that embeds this (see docs/CLIENT_BOT.md).
  // Only these sites may hand us a sign-in.
  const PARENTS = ['https://axiomprint.com', 'https://www.axiomprint.com'];
  const KEY = 'novaClientToken';
  // Test mode: the header script passes the test key (?k=…) while the chat is
  // open only to testers.
  const TEST_KEY = new URLSearchParams(location.search).get('k') || '';
  let token = null, chat = null;
  try { token = sessionStorage.getItem(KEY); } catch (e) {}
  function parentSay(msg) { PARENTS.forEach(o => { try { parent.postMessage(msg, o); } catch (e) {} }); }
  function keep(t) { token = t; try { sessionStorage.setItem(KEY, t); } catch (e) {} }

  async function session(body) {
    const r = await fetch('/api/client-bot/session', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ previous: token || undefined, test_key: TEST_KEY || undefined }, body || {})) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { closed(); return null; }
    if (!j.ok) return null;
    keep(j.token);
    return j;
  }
  function closed() {
    document.getElementById('pcBody').innerHTML = '<div class="pc-off">NovaAI is coming soon. Please contact the AxiomPrint team for help.</div>';
  }
  async function hello() {
    let r = await fetch('/api/client-bot/hello', { headers: { 'Authorization': 'Bearer ' + token } });
    if (r.status === 401) {                       // an old or expired visitor token: start fresh
      token = null; try { sessionStorage.removeItem(KEY); } catch (e) {}
      if (!(await session({}))) return;
      r = await fetch('/api/client-bot/hello', { headers: { 'Authorization': 'Bearer ' + token } });
    }
    if (r.status === 403) { closed(); return; }
    const j = await r.json().catch(() => ({}));
    document.getElementById('pcSub').textContent = j.customer && j.customer.name ? 'Signed in as ' + j.customer.name : 'AxiomPrint\u2019s AI assistant';
    signedIn = !!j.customer;
    greeting = j.greeting;
    const opts = {
      getToken: () => token, greeting: j.greeting,
      // Signed in: Add to Cart goes straight into the website cart (Nova's server
      // does it); the page is told so it can refresh its cart count.
      signedIn: () => signedIn, onCartAdded: cartChanged,
      suggestions: j.customer
        ? [['Where is my order?', 'Where is my latest order?'], ['Business card prices', 'How much are 500 business cards?']]
        : [['Business card prices', 'How much are 500 business cards?'], ['Banner options', 'What banner materials do you have?']]
    };
    if (!chat) chat = ClientChat.mount(document.getElementById('pcBody'), opts);
    else chat.resume(j.greeting, opts.suggestions);   // signed in or out: replace the greeting, or keep the conversation on screen
    if (pageNow) chat.setPage(pageNow.url, pageNow.title);
    paintSignin();
    paintHistory();
    dragArea();
  }

  // The website page we are on (for the team's transcript), from the header script.
  let pageNow = null;
  // Desktop: the website drags the window by the title area of this bar; tell it how
  // wide that area is so the buttons on the right stay clickable.
  function dragArea() {
    if (!embedded) return;
    const head = document.querySelector('.pc-head');
    const btns = Array.from(head.querySelectorAll('button')).filter(b => b.offsetParent);
    const left = btns.length ? Math.min.apply(null, btns.map(b => b.getBoundingClientRect().left)) : head.offsetWidth;
    parentSay({ type: 'nova-client:drag-area', w: Math.max(0, Math.round(left - 8)), h: head.offsetHeight });
  }
  window.addEventListener('resize', dragArea);
  if (window.ResizeObserver) new ResizeObserver(dragArea).observe(document.querySelector('.pc-head'));

  // ---- History (signed-in customers): earlier chats, newest first ----
  let greeting = '';
  const histEl = document.getElementById('pcHist'), histList = document.getElementById('pcHistList');
  function paintHistory() {
    document.getElementById('pcNewBtn').hidden = !chat;
    document.getElementById('pcHistBtn').hidden = !signedIn;
    setTimeout(dragArea, 0);
    if (!signedIn) histEl.hidden = true;
  }
  function placeHistory() { histEl.style.top = document.querySelector('.pc-head').offsetHeight + 'px'; }
  function ago(t) {
    const d = new Date(String(t || '').replace(' ', 'T') + (/[zZ]$/.test(String(t || '')) ? '' : 'Z'));
    if (isNaN(d)) return { day: '', text: '' };
    const now = new Date(), mins = Math.round((now - d) / 60000);
    const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((startOf(now) - startOf(d)) / 86400000);
    const day = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : days < 7 ? 'This week' : days < 31 ? 'This month' : 'Earlier';
    const text = days === 0 ? (mins < 1 ? 'Just now' : mins < 60 ? mins + ' min ago' : Math.round(mins / 60) + ' hour' + (Math.round(mins / 60) === 1 ? '' : 's') + ' ago')
      : days === 1 ? 'Yesterday at ' + time
      : d.toLocaleDateString(undefined, { weekday: days < 7 ? 'long' : undefined, month: 'short', day: 'numeric' }) + ' at ' + time;
    return { day: day, text: text };
  }
  async function openHistory() {
    placeHistory(); histEl.hidden = false;
    histList.innerHTML = '<div class="pc-hist-empty">Loading your chats\u2026</div>';
    let j = {};
    try {
      const r = await fetch('/api/client-bot/history', { headers: { 'Authorization': 'Bearer ' + token } });
      j = await r.json().catch(() => ({}));
    } catch (e) { j = {}; }
    if (!j.ok) { histList.innerHTML = '<div class="pc-hist-empty">' + ClientChatEsc(j.error || 'Your chats could not be loaded.') + '</div>'; return; }
    const cur = chat && chat.chatId ? chat.chatId() : null;
    if (!j.chats.length) { histList.innerHTML = '<div class="pc-hist-empty">No earlier chats yet. Your conversations will show up here.</div>'; return; }
    let lastDay = null;
    histList.innerHTML = j.chats.map(c => {
      const a = ago(c.updated), head = a.day !== lastDay ? '<div class="pc-hist-day">' + a.day + '</div>' : '';
      lastDay = a.day;
      return head + '<button type="button" class="pc-hist-item' + (c.id === cur ? ' on' : '') + '" data-id="' + c.id + '"><b>' +
        ClientChatEsc(c.title) + '</b><span>' + a.text + ' \u00b7 ' + c.messages + ' message' + (c.messages === 1 ? '' : 's') + '</span></button>';
    }).join('');
  }
  function ClientChatEsc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  document.getElementById('pcHistBtn').onclick = () => { if (histEl.hidden) openHistory(); else histEl.hidden = true; };
  document.getElementById('pcHistX').onclick = () => { histEl.hidden = true; };
  document.getElementById('pcHistNew').onclick = () => { if (chat) chat.reset(greeting); histEl.hidden = true; };
  // New chat: a fresh conversation (the last one stays under History for signed-in customers).
  document.getElementById('pcNewBtn').onclick = () => { if (chat) chat.reset(greeting); histEl.hidden = true; };
  histList.addEventListener('click', async (e) => {
    const b = e.target.closest('.pc-hist-item');
    if (!b || !chat) return;
    b.querySelector('span').textContent = 'Opening\u2026';
    const r = await chat.load(parseInt(b.getAttribute('data-id')));
    if (r === true) histEl.hidden = true;
    else b.querySelector('span').textContent = typeof r === 'string' ? r : 'Please wait for the answer to finish.';
  });
  window.addEventListener('resize', () => { if (!histEl.hidden) placeHistory(); });

  // ---- Add to Cart ----
  // Nova's server adds the item to the customer's cart (docs/CLIENT_BOT.md); this
  // only tells the website, so it refreshes its cart count straight away. The
  // site answers nova-client:cart-result, which needs nothing from us.
  let signedIn = false;
  function cartChanged() {
    parentSay({ type: 'nova-client:add-to-cart', id: Math.random().toString(36).slice(2), item: { alreadyAdded: true } });
  }

  // ---- Sign in from the chat ----
  // Guests see a Sign in bar. If the website can sign a customer in for us
  // (it answered nova-client:login-ready), the chat shows an email / password
  // form and hands the details to the PAGE — never to Nova's server or the AI.
  // Otherwise Sign in opens the website's own login, and the header script
  // notices the new login and signs the chat in.
  let loginReady = false, loginWait = null, waitingPopup = false;
  let loginUrl = 'https://axiomprint.com/login', loginPopup = null;
  const embedded = window.parent !== window;
  // Sign in sits in the top bar for guests (only inside the website, where it can work).
  let waitTimer = null;
  function paintSignin() {
    const btn = document.getElementById('pcSigninBtn');
    btn.hidden = signedIn || !embedded;
    btn.classList.toggle('wait', !signedIn && waitingPopup);
    document.getElementById('pcSigninLbl').textContent = !signedIn && waitingPopup ? 'Signing in\u2026' : 'Sign in';
  }
  document.getElementById('pcSigninBtn').onclick = () => {
    if (loginReady) {
      document.getElementById('pcLogin').hidden = false;
      document.getElementById('pcLoginErr').textContent = '';
      setTimeout(() => document.getElementById('pcEmail').focus(), 30);
      return;
    }
    waitingPopup = true;
    // Opened here, inside the click, so pop-up blockers (Safari) allow it; the
    // page opens it instead (or goes to the login page) if this was refused.
    try { loginPopup = window.open(loginUrl, 'novaLogin', 'width=480,height=720'); } catch (e) { loginPopup = null; }
    parentSay({ type: 'nova-client:open-login', opened: !!loginPopup });
    // "Signing in…" while the website's login window is open; the chat picks the
    // login up by itself. Tapping again opens the window again.
    paintSignin();
    clearTimeout(waitTimer);
    waitTimer = setTimeout(() => { waitingPopup = false; paintSignin(); }, 3 * 60 * 1000);
  };
  document.getElementById('pcLoginX').onclick = () => { document.getElementById('pcLogin').hidden = true; };
  document.getElementById('pcLoginForm').onsubmit = (e) => {
    e.preventDefault();
    const go = document.getElementById('pcLoginGo'), err = document.getElementById('pcLoginErr');
    const pass = document.getElementById('pcPass');
    const id = Math.random().toString(36).slice(2);
    go.disabled = true; go.textContent = 'Signing in…'; err.textContent = '';
    loginWait = { id: id, done: (ok, msg) => {
      loginWait = null; go.disabled = false; go.textContent = 'Sign in'; pass.value = '';
      if (ok) document.getElementById('pcLogin').hidden = true;
      else err.textContent = msg || 'That email and password did not match.';
    } };
    parentSay({ type: 'nova-client:login', id: id, email: document.getElementById('pcEmail').value.trim(), password: pass.value });
    setTimeout(() => { if (loginWait && loginWait.id === id) loginWait.done(false, 'The website did not answer — please try again.'); }, 20000);
  };

  window.addEventListener('message', async (ev) => {
    if (PARENTS.indexOf(ev.origin) === -1 || !ev.data) return;
    if (ev.data.type === 'nova-client:login-ready') { loginReady = true; return; }
    if (ev.data.type === 'nova-client:page') {
      pageNow = { url: String(ev.data.url || '').slice(0, 500), title: String(ev.data.title || '').slice(0, 150) };
      if (chat) chat.setPage(pageNow.url, pageNow.title);
      return;
    }
    if (ev.data.type === 'nova-client:login-url') {     // only a page on the website itself
      try { const u = new URL(String(ev.data.url || '')); if (PARENTS.indexOf(u.origin) !== -1) loginUrl = u.href; } catch (e) {}
      return;
    }
    if (ev.data.type === 'nova-client:login-result' && loginWait && ev.data.id === loginWait.id) {
      loginWait.done(!!ev.data.ok, ev.data.error); return;
    }
    // Signed out on the website: back to products only.
    if (ev.data.type === 'nova-client:signout') {
      if (!signedIn && chat) return;                // already a guest
      token = null; if (await session({})) hello(); return;
    }
    if (ev.data.type !== 'nova-client:signin') return;
    const body = ev.data.payload && ev.data.sig ? { payload: ev.data.payload, sig: ev.data.sig }
               : ev.data.customer_token ? { customer_token: ev.data.customer_token } : null;
    if (!body) return;
    waitingPopup = false;
    try { if (loginPopup && !loginPopup.closed) loginPopup.close(); } catch (e) {}
    loginPopup = null;
    if (await session(body)) hello();
  });

  (async function start() {
    // Every page load starts as "not signed in" (keeping the same visitor), and
    // only a fresh sign-in from the website upgrades it. A token left over from an
    // earlier page never shows one customer's orders to whoever uses the tab next.
    if (!(await session({}))) return;
    await hello();
    parentSay({ type: 'nova-client:ready' });     // the website answers with nova-client:signin
  })();
</script>
</body>
</html>
